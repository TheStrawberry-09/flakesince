name: ingest

on:
  push:
    branches: [main]
    paths:
      - 'ingest/**'
      - '.github/workflows/ingest.yml'
  pull_request:
    paths:
      - 'ingest/**'
      - '.github/workflows/ingest.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: ingest/go.mod
          cache: false

      - run: go vet ./...
      - run: go test ./...