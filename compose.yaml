services:
  postgres:
    image: postgres:18
    container_name: flakesince-postgres
    environment:
      POSTGRES_DB: flakesince
      POSTGRES_USER: flakesince
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: