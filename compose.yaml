services:
  postgres:
    image: postgres:18
    container_name: flakesince-postgres
    environment:
      POSTGRES_DB: flakesince
      POSTGRES_USER: flakesince
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  sqs:
    image: softwaremill/elasticmq-native:1.7.1
    container_name: flakesince-sqs
    ports:
      - "9324:9324"
    volumes:
      - ./deploy/local/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  pgdata: